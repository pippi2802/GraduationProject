# Audio stream processor, two instances (cpu1, cpu2) in one pod under one claim for both cpus; see single_core_pod.yaml.
---
apiVersion: v1
kind: Namespace
metadata: { name: rq2 }
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq2, name: "rq2-multi-params" }
spec: { count: 2, runtime: 9300, period: 10000, requestedCpus: [1, 2] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq2, name: "rq2-multi-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "rq2-multi-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq2
  name: "rq2-multi"
  labels: { app: rq2-workload, role: worker }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: rq2, kubernetes.io/hostname: rt-k8s-worker-6 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: audio
      image: pippina2/rq2-audio:v2
      imagePullPolicy: IfNotPresent
      command: ["python3", "run.py"]
      args: ["cpus=[1,2]", "period_ms=10", "jobs=100000", "output=/results/multi_core"]
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "rq2-multi-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq2/results/multi_core, type: DirectoryOrCreate }
