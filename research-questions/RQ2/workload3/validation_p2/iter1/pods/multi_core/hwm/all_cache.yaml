# id: rq2-val2i1-aud-multi-hwm-all-cache
# Online validation of the audio workload, multi-core, Route 3 (HWM): Q = largest C of the stress runs x alpha_drift (one budget for every tolerance)
# no tolerance (one budget for every p), with the cache enemy (started on the node around the run)
# Reservation: runtime 3446 us of period 10000 us (Q/T = 0.345), from budgets.csv. 50000 jobs per instance; cpus 1,2; pinned to rt-k8s-worker-6.
# Generated by make_manifests.py: edit budgets.csv and regenerate instead of editing this file.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq2, name: "rq2-val2i1-aud-multi-hwm-all-cache-params" }
spec: { count: 2, runtime: 3446, period: 10000, requestedCpus: [1, 2] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq2, name: "rq2-val2i1-aud-multi-hwm-all-cache-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "rq2-val2i1-aud-multi-hwm-all-cache-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq2
  name: "rq2-val2i1-aud-multi-hwm-all-cache"
  labels: { app: rq2-workload, role: worker, validation: "true", interference: "cache" }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: rq2, kubernetes.io/hostname: rt-k8s-worker-6 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: audio
      image: pippina2/rq2-audio:v2
      imagePullPolicy: IfNotPresent
      command: ["python3", "run.py"]
      args: ["cpus=[1,2]", "period_ms=10", "jobs=50000", "output=/results/rq2-val2i1-aud-multi-hwm-all-cache"]
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "rq2-val2i1-aud-multi-hwm-all-cache-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq2/results/audio_validation_p2_i1, type: DirectoryOrCreate }
