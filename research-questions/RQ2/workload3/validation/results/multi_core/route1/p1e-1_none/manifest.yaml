# id: rq2-val-aud-multi-r1-p1e-1-none
# Online validation of the audio workload, multi-core, Route 1: Q = C_p of the stress runs x alpha_drift
# tolerance p = 0.1, without interference
# Reservation: runtime 1178 us of period 10000 us (Q/T = 0.118), from budgets.csv. 50000 jobs per instance; cpus 1,2; pinned to rt-k8s-worker-6.
# Generated by make_manifests.py: edit budgets.csv and regenerate instead of editing this file.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq2, name: "rq2-val-aud-multi-r1-p1e-1-none-params" }
spec: { count: 2, runtime: 1178, period: 10000, requestedCpus: [1, 2] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq2, name: "rq2-val-aud-multi-r1-p1e-1-none-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "rq2-val-aud-multi-r1-p1e-1-none-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq2
  name: "rq2-val-aud-multi-r1-p1e-1-none"
  labels: { app: rq2-workload, role: worker, validation: "true", interference: "none" }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: rq2, kubernetes.io/hostname: rt-k8s-worker-6 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: audio
      image: pippina2/rq2-audio:v2
      imagePullPolicy: IfNotPresent
      command: ["python3", "run.py"]
      args: ["cpus=[1,2]", "period_ms=10", "jobs=50000", "output=/results/rq2-val-aud-multi-r1-p1e-1-none"]
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "rq2-val-aud-multi-r1-p1e-1-none-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq2/results/audio_validation, type: DirectoryOrCreate }
