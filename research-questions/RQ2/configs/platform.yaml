# Platform description for RQ2 experiments.
# llc_size_kb is filled in by tools/platform_info.sh; everything else is a
# fixed description of the Azure D8s_v5 test VM (SMT disabled: 4 vCPUs = 4
# physical cores).
vm_size: Standard_D8s_v5
smt_enabled: false
cores:
  housekeeping: [0]
  realtime: [1, 2, 3]
# Filled by tools/platform_info.sh (last-level cache size). Used to size the
# stress/enemy.c cache enemy (= llc_size_kb) and memory enemy (= 10x).
llc_size_kb: null
