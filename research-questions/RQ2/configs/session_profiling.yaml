# Unattended profiling session (rq2/orchestration/session.py).
session: session_profiling_v1

platform:
  rt_cores: [1, 2, 3]   # cpu0 is housekeeping

workload:
  period_ms: 33.333
  work: 3
  width: 1280
  height: 720
  frames: 30
  input: null            # path to a clip inside the container image, or null for synthetic frames
  warmup_jobs: 50
  overrun: skip           # profiling: generous budget, never binds

jobs_per_run: 100000
baseline_end_jobs: 20000
pause_between_runs_s: 60
profiling_budget_factor: 0.95

# Option to also place an enemy on cpu0 (housekeeping), on top of the
# per-deployment enemy cpus below. Default off.
enemy_on_cpu0: false

deployments:
  single_core:
    instances:
      - instance_id: instance0
        cpu: 1
        fifo_prio: 50
    runs:
      - name: baseline
      - name: cache
        enemy: { kind: cache, cpus: [2, 3] }
      - name: memory
        enemy: { kind: memory, cpus: [2, 3] }
      - name: baseline_end
  multi_core:
    instances:
      - instance_id: instance0
        cpu: 1
        fifo_prio: 50
      - instance_id: instance1
        cpu: 2
        fifo_prio: 50
    runs:
      - name: baseline
      - name: cache
        enemy: { kind: cache, cpus: [3] }
      - name: memory
        enemy: { kind: memory, cpus: [3] }
      - name: baseline_end

enemy:
  binary: stress/enemy
  cache: { mode: rw, stride_bytes: 64, size_kb: from_platform_llc }
  memory: { mode: rw, stride_bytes: 64, size_kb_multiplier: 10 }

enemy_effectiveness:
  enabled: true
  victim_cpu: 1
  enemy_cpus: [2, 3]
  trials: 30
  passes: 50
  stride_bytes: 64
  memory_size_kb_multiplier: 10
  slowdown_threshold: 1.05

checks:
  sample_interval_s: 5
  stall_factor: 2.0
  stationarity_threshold_pct: 5.0
  interference_threshold: 1.02
  drift_threshold_pct: 5.0
  release_spacing_tol_frac: 0.02
  utilization_high_threshold_pct: 95.0
  utilization_idle_threshold_pct: 5.0
