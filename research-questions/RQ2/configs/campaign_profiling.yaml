# Profiling campaign (Step 1): measure C_k under baseline and interference
# conditions, to feed tail_estimation.py / inflation.py.
kind: profiling
session: profiling_v1
results_root: results/raw
osnoise_capture: false
osnoise_duration_s: 60
seed: 1

workload:
  period_ms: 33.3
  work: 3
  width: 1280
  height: 720
  frames: 30
  overrun: skip      # profiling: generous budget, never used up, so skip is a no-op safety net

jobs_per_run: 100000
sessions_per_condition: 3   # independent repetitions, for alpha_drift's cross-session spread

# One entry per deployment. Each instance runs on its own RT core.
deployments:
  single_core:
    instances:
      - instance_id: instance0
        cpu: 1
        fifo_prio: 50
    # Enemy CPU sets per dial level, cpu1 (the task) is never an enemy target.
    dial_levels:
      - name: dial1
        enemy_cpus: [2]
      - name: dial2
        enemy_cpus: [2, 3]
      - name: dial3
        enemy_cpus: [2, 3, 0]
  multi_core:
    instances:
      - instance_id: instance0
        cpu: 1
        fifo_prio: 50
      - instance_id: instance1
        cpu: 2
        fifo_prio: 50
    dial_levels:
      - name: dial1
        enemy_cpus: [3]
      - name: dial2
        enemy_cpus: [3, 0]

enemy:
  binary: stress/enemy
  cache:
    mode: rw
    stride_bytes: 64
    size_kb: from_platform_llc     # = configs/platform.yaml llc_size_kb
  memory:
    mode: rw
    stride_bytes: 64
    size_kb_multiplier: 10          # x LLC size

housekeeping_load:
  enabled: true
  cpu: 0
