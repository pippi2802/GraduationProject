# Validation campaign (Step 5): run the workload under the derived budgets
# and check observed behaviour against the model's prediction.
kind: validation
session: validation_v1
results_root: results/raw
seed: 2

budget_json: results/derived/budget/budgets.json
variants: [full, no_stress, no_drift, minimal]
p_levels: [0.1, 0.01, 0.001]
stress: [off, on]   # off = baseline, on = worst-case dial level for that deployment

workload:
  period_ms: 33.3
  work: 3
  width: 1280
  height: 720
  frames: 30
  overrun: continue   # validation exercises the real CBS backlog behaviour

jobs_per_run: 50000
sessions_per_condition: 3

deployments:
  single_core:
    instances:
      - instance_id: instance0
        cpu: 1
        fifo_prio: 50
    stress_enemy_cpus: [2, 3, 0]   # worst dial level used for stress: on
  multi_core:
    instances:
      - instance_id: instance0
        cpu: 1
        fifo_prio: 50
      - instance_id: instance1
        cpu: 2
        fifo_prio: 50
    stress_enemy_cpus: [3, 0]

enemy:
  binary: stress/enemy
  cache:
    mode: rw
    stride_bytes: 64
    size_kb: from_platform_llc
  memory:
    mode: rw
    stride_bytes: 64
    size_kb_multiplier: 10

housekeeping_load:
  enabled: false
