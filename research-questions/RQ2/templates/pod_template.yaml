# Pod template for RQ2, grounded in the real KubeDeadline manifest pattern
# used elsewhere in this repo (see
# research-questions/RQ1_final/kubedeadline-experiments/generate_yaml.py and
# models/*/generated/*.yaml): a RtClaimParameters + ResourceClaimTemplate
# pair, consumed by the Pod via resourceClaims. Still not verified against a
# real deploy for RQ2 specifically (namespace/node label/image are guesses
# copied from that convention) - ask before using this to render pods for a
# real run.
#
# Placeholders: {{NAME}} {{CPUS}} {{Q_US}} {{T_US}} {{ARGS}} {{RESULTS_DIR}}
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq2, name: "{{NAME}}-params" }
spec: { count: 1, runtime: {{Q_US}}, period: {{T_US}}, requestedCpus: [{{CPUS}}] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq2, name: "{{NAME}}-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "{{NAME}}-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq2
  name: "{{NAME}}"
  labels: { app: rq2-workload }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: rq2 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: rt-video
      image: rq2-workload:latest
      command: ["python3"]
      args: {{ARGS}}
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "{{NAME}}-claim" } }
  volumes:
    - name: results
      hostPath: { path: {{RESULTS_DIR}}, type: DirectoryOrCreate }
