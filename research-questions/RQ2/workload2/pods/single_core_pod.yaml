# Single-core run: one instance on cpu1 under a KubeDeadline CBS reservation (same shape as ../../workload/pods).
# Periodic, period 100 ms (period_ms=100 on the command line, no rebuild needed). The claim is generous for profiling: 93000 of 100000 us (the node's cap is 0.94),
# far above the task's CPU time (about 46-56 ms), so the budget never limits it. Jobs: 50000 here; step 3 overrides with --jobs 30000.
# Edit before running: image (docker push first).
# Pod name, hostPath and file names match workload/pull_results.sh (run from the RQ2 folder):
#   OUT_ROOT=workload2/results workload/pull_results.sh single_core <condition>
---
apiVersion: v1
kind: Namespace
metadata: { name: rq2 }
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq2, name: "rq2-single-instance0-params" }
spec: { count: 1, runtime: 93000, period: 100000, requestedCpus: [1] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq2, name: "rq2-single-instance0-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "rq2-single-instance0-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq2
  name: "rq2-single-instance0"
  labels: { app: rq2-workload, role: worker }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: rq2, rq2-role: single-core }
  tolerations: [{ operator: Exists }]
  containers:
    - name: seg
      image: pippina2/rq2-seg:v2
      imagePullPolicy: IfNotPresent
      command: ["python3", "run.py", "configs/single_core.json", "period_ms=100", "jobs=50000"]   # period 100 ms; 50000 jobs for profiling (step 2), step 3 passes --jobs 30000
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "rq2-single-instance0-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq2/results/single_core, type: DirectoryOrCreate }
