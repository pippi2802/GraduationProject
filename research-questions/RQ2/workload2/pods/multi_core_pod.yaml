# Multi-core run: ONE claim for cpu1 and cpu2, ONE pod; run.py starts one process per cpu of the config (same start time).
# See single_core_pod.yaml for the reservation and the edits before running.
#   OUT_ROOT=workload2/results workload/pull_results.sh multi_core <condition>
---
apiVersion: v1
kind: Namespace
metadata: { name: rq2 }
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq2, name: "rq2-multi-params" }
spec: { count: 2, runtime: 93000, period: 100000, requestedCpus: [1, 2] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq2, name: "rq2-multi-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "rq2-multi-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq2
  name: "rq2-multi"
  labels: { app: rq2-workload, role: worker }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: rq2, rq2-role: multi-core }
  tolerations: [{ operator: Exists }]
  containers:
    - name: seg
      image: pippina2/rq2-seg:v2
      imagePullPolicy: IfNotPresent
      command: ["python3", "run.py", "configs/multi_core.json", "period_ms=100", "jobs=50000"]   # period 100 ms; 50000 jobs for profiling (step 2), step 3 passes --jobs 30000
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "rq2-multi-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq2/results/multi_core, type: DirectoryOrCreate }
