# id: rq2-val-multi-r1-p1e-3-mem
# Online validation, multi-core, Route 1: Q = C_p^stress(S1) x alpha_drift
# tolerance p = 0.001, with the memory enemy (started by run_validation.sh)
# Budget Q* = 23.3292 ms -> reservation runtime 23330 us of period 41667 us (Q/T = 0.560), from budgets.csv
# 50000 jobs per instance; instance0 on cpu1, instance1 on cpu2; pinned to rt-k8s-worker-6.
# Generated by make_manifests.py - edit budgets.csv and regenerate instead of editing this file.
---
apiVersion: v1
kind: ConfigMap
metadata: { namespace: rq2, name: "rq2-val-multi-r1-p1e-3-mem-config" }
data:
  multi_core.json: |
    {
      "instances": [
        {
          "instance_id": "instance0",
          "cpu": 1,
          "fifo_prio": 50,
          "period_ms": 41.667,
          "work": 5,
          "width": 1280,
          "height": 720,
          "frames": 600,
          "input": "/app/videos/sintel_720p_600.mp4",
          "jobs": 50000,
          "overrun": "skip",
          "output": "/results/rq2-val-multi-r1-p1e-3-mem_instance0.csv"
        },
        {
          "instance_id": "instance1",
          "cpu": 2,
          "fifo_prio": 50,
          "period_ms": 41.667,
          "work": 5,
          "width": 1280,
          "height": 720,
          "frames": 600,
          "input": "/app/videos/sintel_720p_600.mp4",
          "jobs": 50000,
          "overrun": "skip",
          "output": "/results/rq2-val-multi-r1-p1e-3-mem_instance1.csv"
        }
      ]
    }
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq2, name: "rq2-val-multi-r1-p1e-3-mem-params" }
spec: { count: 2, runtime: 23330, period: 41667, requestedCpus: [1, 2] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq2, name: "rq2-val-multi-r1-p1e-3-mem-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "rq2-val-multi-r1-p1e-3-mem-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq2
  name: "rq2-val-multi-r1-p1e-3-mem"
  labels: { app: rq2-workload, role: worker, validation: "true", interference: "memory" }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: rq2, kubernetes.io/hostname: rt-k8s-worker-6 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: rt-video
      image: pippina2/rq2-workload:v2
      imagePullPolicy: IfNotPresent
      command: ["python3", "launch.py"]
      args: ["/cfg/multi_core.json"]
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }, { name: cfg, mountPath: /cfg }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "rq2-val-multi-r1-p1e-3-mem-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq2/results/multi_core, type: DirectoryOrCreate }
    - name: cfg
      configMap: { name: "rq2-val-multi-r1-p1e-3-mem-config" }
