# id: rq2-val-single-r2b-p1e-1-none
# Online validation, single-core, Route 2b: Q = C_p^base(S1) x alpha_cores,platform(m) x alpha_drift
# tolerance p = 0.1, without interference
# Budget Q* = 19.8247 ms -> reservation runtime 19825 us of period 41667 us (Q/T = 0.476), from budgets.csv
# 50000 jobs per instance; instance0 on cpu1; pinned to rt-k8s-worker-7.
# Generated by make_manifests.py - edit budgets.csv and regenerate instead of editing this file.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq2, name: "rq2-val-single-r2b-p1e-1-none-params" }
spec: { count: 1, runtime: 19825, period: 41667, requestedCpus: [1] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq2, name: "rq2-val-single-r2b-p1e-1-none-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "rq2-val-single-r2b-p1e-1-none-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq2
  name: "rq2-val-single-r2b-p1e-1-none"
  labels: { app: rq2-workload, role: worker, validation: "true", interference: "none" }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: rq2, kubernetes.io/hostname: rt-k8s-worker-7 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: rt-video
      image: pippina2/rq2-workload:v2
      imagePullPolicy: IfNotPresent
      command: ["python3", "rt_video.py"]
      args:
        - "--instance-id=instance0"
        - "--cpu=1"
        - "--fifo-prio=50"
        - "--period-ms=41.667"
        - "--work=5"
        - "--width=1280"
        - "--height=720"
        - "--frames=600"
        - "--input=/app/videos/sintel_720p_600.mp4"
        - "--jobs=50000"
        - "--overrun=skip"
        - "--output=/results/rq2-val-single-r2b-p1e-1-none_instance0.csv"
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "rq2-val-single-r2b-p1e-1-none-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq2/results/single_core, type: DirectoryOrCreate }
