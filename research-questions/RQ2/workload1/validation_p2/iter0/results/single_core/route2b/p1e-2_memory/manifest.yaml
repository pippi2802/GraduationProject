# id: rq2-val2-vid-single-r2b-p1e-2-mem
# Online validation of the video workload, single-core, Route 2: Q = C_p of the baselines x alpha_platform(m) x alpha_drift
# tolerance p = 0.01, with the memory enemy (started on the node around the run)
# Reservation: runtime 25778 us of period 41667 us (Q/T = 0.619), from budgets.csv. 20000 jobs per instance; cpus [1]; pinned to rt-k8s-worker-7.
# Generated by make_manifests.py: edit budgets.csv and regenerate instead of editing this file.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq2, name: "rq2-val2-vid-single-r2b-p1e-2-mem-params" }
spec: { count: 1, runtime: 25778, period: 41667, requestedCpus: [1] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq2, name: "rq2-val2-vid-single-r2b-p1e-2-mem-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "rq2-val2-vid-single-r2b-p1e-2-mem-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq2
  name: "rq2-val2-vid-single-r2b-p1e-2-mem"
  labels: { app: rq2-workload, role: worker, validation: "true", interference: "memory" }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: rq2, kubernetes.io/hostname: rt-k8s-worker-7 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: rt-video
      image: pippina2/rq2-workload:v2
      imagePullPolicy: IfNotPresent
      command: ["python3", "rt_video.py"]
      args:
        - "--instance-id=instance0"
        - "--cpu=1"
        - "--fifo-prio=50"
        - "--period-ms=41.667"
        - "--work=5"
        - "--width=1280"
        - "--height=720"
        - "--frames=600"
        - "--input=/app/videos/sintel_720p_600.mp4"
        - "--jobs=20000"
        - "--overrun=skip"
        - "--output=/results/rq2-val2-vid-single-r2b-p1e-2-mem_instance0.csv"
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "rq2-val2-vid-single-r2b-p1e-2-mem-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq2/results/video_validation_p2, type: DirectoryOrCreate }
