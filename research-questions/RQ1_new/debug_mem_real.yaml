apiVersion: v1
kind: Pod
metadata: { name: debug-mem-real, namespace: rq1-model3 }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model3 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: debug-mem-real
      image: pippina2/rq1-probe:v2
      command: ["/bin/sh"]
      args:
        - "-c"
        - "mkdir -p /results; taskset -c 2 /usr/local/bin/matmul --kind ptrchase --buf-kb 65536 --M 48 --K 346 --period-us 100000 --n-jobs 100000000 --warmup 200 --priority 0 --cpu 2 --seed 20260713 --logfile /results/jobs.csv & sleep 15; kill %1 2>/dev/null; echo DONE; ls -la /results; sleep 300"
      securityContext: { capabilities: { add: ["SYS_NICE", "IPC_LOCK"] } }
      volumeMounts: [{ name: results, mountPath: /results }]
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model3/debug/real, type: DirectoryOrCreate }
