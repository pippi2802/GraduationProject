---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq1-model3-w3, name: "model3-w3-tight-u90-comp-params" }
spec: { count: 1, runtime: 4000, period: 10000, requestedCpus: [@@REQUESTED_CPUS@@] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq1-model3-w3, name: "model3-w3-tight-u90-comp-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "model3-w3-tight-u90-comp-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model3-w3
  name: "model3-w3-tight-u90-comp"
  labels: { app: model3-w3, role: competitor }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model3-w3 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1-probe:v4
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--cpu env"; else PIN=""; CPU=""; fi
          # reserved competitor: runs until the cell is torn down, contending for
          # the target's whole run (same rationale as model2's neighbour).
          exec $PIN /usr/local/bin/matmul --kind primes --buf-kb 131072 --M 48 --K 7 --period-us 10000 \
            --n-jobs 100000000 --warmup 200 --priority 90 --seed 20260713 $CPU --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "model3-w3-tight-u90-comp-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model3-w3/tight/U0.9/comp, type: DirectoryOrCreate }
