# BASE manifest for one model-3 cell (target with an m=2 reservation -- count:2
# below asks the driver for 2 cores; run_job.sh retries placement until that pair
# is the desired PAIR_TYPE, sibling or physical, per config.yaml's comment. The
# probe itself still pins to only the FIRST cpu of the pair (RT_CPUSET); the
# second is the competitor's landing spot. The competitor (reserved or
# unreserved, per COMPETITOR_TYPE) is generated by generate_yaml.py and placed by
# run_job.sh -- see config.yaml co_runners.
#
# worker-3 variant of models/model3/job.yaml: namespace/nodeSelector/labels/
# hostPath repointed at this node's own identity (rq1-model3-w3,
# experiment-model=model3-w3) -- these are NOT parameterized by generate_yaml.py
# (only @@NAME@@/@@RUNTIME@@/@@PERIOD@@/@@K@@/@@SUB@@ are), so a straight copy of
# model3/job.yaml would silently keep targeting worker-0.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq1-model3-w3, name: "@@NAME@@-params" }
spec: { count: 2, runtime: @@RUNTIME@@, period: @@PERIOD@@ }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq1-model3-w3, name: "@@NAME@@-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "@@NAME@@-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model3-w3
  name: "@@NAME@@"
  labels: { app: model3-w3, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model3-w3 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1-probe:v2
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--cpu env"; else PIN=""; CPU=""; fi
          exec $PIN /usr/local/bin/matmul --M 48 --K @@K@@ --period-us @@PERIOD@@ \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 $CPU \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "@@NAME@@-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model3-w3/@@SUB@@/target, type: DirectoryOrCreate }
