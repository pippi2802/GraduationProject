# BASE manifest for one model-4-p cell -- identical design to model4's own
# job.yaml (see there for the full rationale), just its own namespace/node so
# it can run concurrently with model4-m on a different physical node.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq1-model4-p, name: "model4-p-soft-u60-params" }
spec: { count: 2, runtime: 60000, period: 100000 }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq1-model4-p, name: "model4-p-soft-u60-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "model4-p-soft-u60-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model4-p
  name: "model4-p-soft-u60"
  labels: { app: model4-p, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model4-p }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1-probe:v3
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--threads 2 --cpu-list env"; else PIN=""; CPU="--threads 2 --cpu-list 0,1"; fi
          exec $PIN /usr/local/bin/matmul --kind ptrchase --buf-kb 131072 --M 48 --K 709 --period-us 100000 \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 $CPU \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "model4-p-soft-u60-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model4-p/soft/U0.6/target, type: DirectoryOrCreate }
