# BASE manifest for one model-4-p cell -- identical design to model4's own
# job.yaml (see there for the full rationale), just its own namespace/node so
# it can run concurrently with model4-m on a different physical node.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq1-model4-p, name: "model4-p-tight-u90-params" }
spec: { count: 2, runtime: 9000, period: 10000 }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq1-model4-p, name: "model4-p-tight-u90-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "model4-p-tight-u90-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model4-p
  name: "model4-p-tight-u90"
  labels: { app: model4-p, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model4-p }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1-probe:v3
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          # the driver is SMT-blind and does not guarantee its RT_CPUSET range
          # is low-to-high (found 2026-08-09: "3-2" instead of "2-3" broke both
          # taskset, which rejects a reversed range outright, and matmul's own
          # --cpu-list range expansion, which silently resolves to zero cpus
          # when start>end) -- normalize to a sorted comma list before either
          # ever sees it.
          if [ -n "$RT_CPUSET" ]; then
            RT_CPUSET=$(echo "$RT_CPUSET" | tr ',' '\n' | while read -r p; do
              case "$p" in
                *-*) a="${p%-*}"; b="${p#*-}"; if [ "$a" -le "$b" ]; then seq "$a" "$b"; else seq "$b" "$a"; fi ;;
                *) echo "$p" ;;
              esac
            done | sort -n | paste -sd, -)
            PIN="taskset -c $RT_CPUSET"; CPU="--threads 2 --cpu-list env"
          else
            PIN=""; CPU="--threads 2 --cpu-list 0,1"
          fi
          exec $PIN /usr/local/bin/matmul --kind ptrchase --buf-kb 131072 --M 48 --K 108 --period-us 10000 \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 $CPU \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "model4-p-tight-u90-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model4-p/tight/U0.9/target, type: DirectoryOrCreate }
