# BASE manifest for one model-2 cell. Same readable target as model1; the co-located
# neighbours are declared in config.yaml (co_runners) and appended by generate_yaml.py.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq1-model2, name: "@@NAME@@-params" }
spec: { count: 1, runtime: @@RUNTIME@@, period: @@PERIOD@@ }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq1-model2, name: "@@NAME@@-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "@@NAME@@-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model2
  name: "@@NAME@@"
  labels: { app: rq1-model2, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model2 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1-probe:v1
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--cpu env"; else PIN=""; CPU=""; fi
          exec $PIN /usr/local/bin/matmul --M 48 --K @@K@@ --period-us @@PERIOD@@ \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 $CPU \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "@@NAME@@-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model2/@@SUB@@/target, type: DirectoryOrCreate }
