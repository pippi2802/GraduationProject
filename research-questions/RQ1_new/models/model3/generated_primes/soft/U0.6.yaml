# BASE manifest for one model-3 cell (target, count:1 -- same as model1/2's
# own claim). The competitor (reserved or unreserved, per COMPETITOR_TYPE) is
# created ONCE per scale by run_job.sh's place_fixed_competitor and left
# running for every cell of that scale, since its own utilization never
# changes across the U sweep; run_job.sh then forces the target onto a cpu
# computed relative to the competitor's own landed cpu (sibling for
# PAIR_TYPE=sibling, a different physical core for PAIR_TYPE=physical) using
# the same delete/recreate-until-landed technique as PIN_RTCPU/model2. See
# config.yaml's comment and run_job.sh for the full mechanism.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq1-model3, name: "model3-soft-u60-params" }
spec: { count: 1, runtime: 60000, period: 100000, requestedCpus: [@@REQUESTED_CPUS@@] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq1-model3, name: "model3-soft-u60-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "model3-soft-u60-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model3
  name: "model3-soft-u60"
  labels: { app: model3, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model3 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1-probe:v4
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--cpu env"; else PIN=""; CPU=""; fi
          exec $PIN /usr/local/bin/matmul --kind primes --buf-kb 131072 --M 48 --K 125 --period-us 100000 \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 $CPU \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "model3-soft-u60-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model3/soft/U0.6/target, type: DirectoryOrCreate }
