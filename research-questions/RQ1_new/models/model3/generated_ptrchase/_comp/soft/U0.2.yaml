---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq1-model3, name: "model3-soft-u20-comp-params" }
spec: { count: 1, runtime: 40000, period: 100000 }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq1-model3, name: "model3-soft-u20-comp-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "model3-soft-u20-comp-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model3
  name: "model3-soft-u20-comp"
  labels: { app: model3, role: competitor }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model3 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1-probe:v2
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--cpu env"; else PIN=""; CPU=""; fi
          # reserved competitor: runs until the cell is torn down, contending for
          # the target's whole run (same rationale as model2's neighbour).
          exec $PIN /usr/local/bin/matmul --kind ptrchase --buf-kb 131072 --M 48 --K 417 --period-us 100000 \
            --n-jobs 100000000 --warmup 200 --priority 90 --seed 20260713 $CPU --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "model3-soft-u20-comp-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model3/soft/U0.2/comp, type: DirectoryOrCreate }
