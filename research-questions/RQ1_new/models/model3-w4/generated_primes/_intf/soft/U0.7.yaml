---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model3-w4
  name: "model3-w4-soft-u70-intf"
  labels: { app: model3-w4, role: interferer }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model3-w4 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: intf
      image: pippina2/rq1-probe:v4
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results
          # UNRESERVED (CFS) matmul pinned to whatever cpu run_job.sh resolves at
          # placement time (the target's spare/sibling cpu); priority 0. Runs
          # until the cell is torn down (same rationale as model2's neighbour
          # and the reserved competitor) -- it's created ONCE per scale and
          # must persist across every cell in it, not just one.
          exec taskset -c @@INTF_CPU@@ /usr/local/bin/matmul --kind primes --buf-kb 131072 --M 48 --K 74 --period-us 100000 \
            --n-jobs 100000000 --warmup 200 --priority 0 --cpu @@INTF_CPU@@ --seed 20260713 --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      volumeMounts: [{ name: results, mountPath: /results }]
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model3-w4/soft/U0.7/intf, type: DirectoryOrCreate }
