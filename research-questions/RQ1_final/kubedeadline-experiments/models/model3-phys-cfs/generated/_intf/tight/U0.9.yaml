---
apiVersion: v1
kind: Pod
metadata:
  namespace: m3-physcfs
  name: "model3-phys-cfs-tight-u90-intf"
  labels: { app: model3-phys-cfs, role: interferer }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: m3-physcfs }
  tolerations: [{ operator: Exists }]
  containers:
    - name: intf
      image: pippina2/rq1final-probe:v1
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results
          exec taskset -c @@INTF_CPU@@ /usr/local/bin/workload --K 301 --sieve-n 8192 --period-us 10000 \
            --n-jobs 100000000 --warmup 200 --priority 0 --cpu @@INTF_CPU@@ --seed 20260713 --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      volumeMounts: [{ name: results, mountPath: /results }]
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1final/m3-physcfs/tight/U0.9/intf, type: DirectoryOrCreate }
