# BASE manifest for one model4 cell -- RQ1_final, event activation only
# (periodic side of the comparison reuses model1's existing data).
# generate_yaml.py stamps model4-soft-u50 50000(Q) 100000(P) 20 1048576 soft/U0.5.
# count=2 -- target + generator, both cpus resolved from ONE RT_CPUSET.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: m4, name: "model4-soft-u50-params" }
spec: { count: 2, runtime: 50000, period: 100000, requestedCpus: [@@REQUESTED_CPUS@@] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: m4, name: "model4-soft-u50-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "model4-soft-u50-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: m4
  name: "model4-soft-u50"
  labels: { app: model4, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: m4 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1final-probe:v1
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          exec /usr/local/bin/workload --K 20 --sieve-n 1048576 --period-us 100000 \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 --clock monotonic \
            --activation event --cpu env --generator-cpu env \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "model4-soft-u50-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1final/model4/soft/U0.5/target, type: DirectoryOrCreate }
