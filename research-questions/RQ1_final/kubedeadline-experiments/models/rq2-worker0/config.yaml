# node-prep-only config for RQ2's rt-k8s-worker-0 (research-questions/RQ2,
# alpha_drift). Not an RQ1_final sweep model - no job.yaml/generate_yaml.py use
# this. Only node-prep/{apply,isolate,harden}.sh read namespace/node_label/
# host_path.
#
# node_label is a per-node-UNIQUE label (distinct from RQ2's own
# `experiment-model: rq2` workload-scheduling label) so the rq1-agent
# DaemonSet + `kubectl get pod -l app=rq1-agent` (which only ever looks at
# pod [0]) binds to exactly this one node.
#   kubectl label node rt-k8s-worker-0 rq2-isolation=worker0
# The RQ2 pod specs additionally need:
#   kubectl label node rt-k8s-worker-0 experiment-model=rq2
namespace: rq2-node-prep-worker0
node_label: rq2-isolation=worker0
host_path: /var/lib/rq2-node-prep/worker0
