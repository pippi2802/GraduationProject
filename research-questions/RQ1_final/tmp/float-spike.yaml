# SPIKE manifest -- thread-floating feasibility test, derived from
# model4/generated/tight/U0.4.yaml. NOT part of the real model4 dataset --
# renamed throughout to float-spike-* so it cannot collide with real
# model4-tight-u40* objects, and writes to its own hostPath.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: m4, name: "float-spike-params" }
spec: { count: 2, runtime: 4000, period: 10000, requestedCpus: [1,2] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: m4, name: "float-spike-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "float-spike-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: m4
  name: "float-spike"
  labels: { app: float-spike, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: m4 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1final-probe:v1
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          exec taskset -c $RT_CPUSET /usr/local/bin/workload --K 300 --sieve-n 8192 --period-us 10000 \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 --clock monotonic \
            --activation periodic \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "float-spike-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1final/float-spike/target, type: DirectoryOrCreate }
