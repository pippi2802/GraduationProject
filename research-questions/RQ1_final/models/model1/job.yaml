# BASE manifest for one model1 cell -- RQ1_final, sieve workload.
# generate_yaml.py stamps @@NAME@@ @@RUNTIME@@(Q) @@PERIOD@@(P) @@K@@ @@SIEVE_N@@ @@SUB@@.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: m1, name: "@@NAME@@-params" }
spec: { count: 1, runtime: @@RUNTIME@@, period: @@PERIOD@@, requestedCpus: [2] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: m1, name: "@@NAME@@-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "@@NAME@@-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: m1
  name: "@@NAME@@"
  labels: { app: model1, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: m1 }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1final-probe:v1
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--cpu env"; else PIN=""; CPU=""; fi
          # switch --clock to realtime here for a clock-choice comparison round
          exec $PIN /usr/local/bin/workload --K @@K@@ --sieve-n @@SIEVE_N@@ --period-us @@PERIOD@@ \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 --clock monotonic $CPU \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "@@NAME@@-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1final/model1/@@SUB@@/target, type: DirectoryOrCreate }
