---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: m3-sibcfs, name: "model3-sib-cfs-tight-u94-comp-params" }
spec: { count: 1, runtime: 4000, period: 10000, requestedCpus: [@@REQUESTED_CPUS@@] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: m3-sibcfs, name: "model3-sib-cfs-tight-u94-comp-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "model3-sib-cfs-tight-u94-comp-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: m3-sibcfs
  name: "model3-sib-cfs-tight-u94-comp"
  labels: { app: model3-sib-cfs, role: competitor }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: m3-sibcfs }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1final-probe:v1
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--cpu env"; else PIN=""; CPU=""; fi
          exec $PIN /usr/local/bin/workload --K 268 --sieve-n 8192 --period-us 10000 \
            --n-jobs 100000000 --warmup 200 --priority 90 --seed 20260713 $CPU --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "model3-sib-cfs-tight-u94-comp-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1final/m3-sibcfs/tight/U0.94/comp, type: DirectoryOrCreate }
