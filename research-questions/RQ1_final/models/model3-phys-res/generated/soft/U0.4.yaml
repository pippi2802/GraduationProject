# BASE manifest for one model3 cell -- RQ1_final, sieve workload. Target only
# (count:1, same as model1/model4's own claim); the competitor (reserved or
# unreserved, per COMPETITOR_TYPE) is a separate manifest generated by
# generate_yaml.py and placed by run_job.sh -- see RQ1's model3/README.md for
# the full mechanism, ported unchanged.
# generate_yaml.py stamps model3-phys-res-soft-u40 40000(Q) 100000(P) 13 1048576 soft/U0.4.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: m3-physres, name: "model3-phys-res-soft-u40-params" }
spec: { count: 1, runtime: 40000, period: 100000, requestedCpus: [@@REQUESTED_CPUS@@] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: m3-physres, name: "model3-phys-res-soft-u40-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "model3-phys-res-soft-u40-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: m3-physres
  name: "model3-phys-res-soft-u40"
  labels: { app: model3-phys-res, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: m3-physres }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1final-probe:v1
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--cpu env"; else PIN=""; CPU=""; fi
          exec $PIN /usr/local/bin/workload --K 13 --sieve-n 1048576 --period-us 100000 \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 --clock monotonic $CPU \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "model3-phys-res-soft-u40-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1final/m3-physres/soft/U0.4/target, type: DirectoryOrCreate }
