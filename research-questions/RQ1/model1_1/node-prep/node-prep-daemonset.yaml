# =============================================================================
# Model 1_1 node-prep DaemonSet (privileged; no custom image). Mounts the scripts
# from a ConfigMap (built by apply.sh), runs prepare-node.sh in DETECT-ONLY mode
# (DRY_RUN=1 -> offlines NOTHING; writes cpu-map.json), then idles. Re-runs on
# reboot. Targets the experiment-model=model1 node.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: model1-1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: model1-1-node-prep
  namespace: model1-1
  labels: { app: model1-1-node-prep }
spec:
  selector:
    matchLabels: { app: model1-1-node-prep }
  template:
    metadata:
      labels: { app: model1-1-node-prep }
    spec:
      hostPID: true
      nodeSelector:
        experiment-model: "model1"
      tolerations:
        - operator: Exists
      containers:
        - name: node-prep
          image: ubuntu:24.04
          securityContext:
            privileged: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              cp /scripts/prepare-node.sh /scripts/restore-node.sh /tmp/
              chmod +x /tmp/prepare-node.sh /tmp/restore-node.sh
              # DETECT-ONLY: offlining vCPUs wedges the Azure VM. DRY_RUN=1 writes
              # cpu-map.json with an EMPTY offline set and changes NOTHING.
              DRY_RUN=1 MAP_OUT=/host/var/lib/model1_1/cpu-map.json /tmp/prepare-node.sh
              echo "[node-prep] detect-only done; idling (no CPUs offlined)."
              sleep infinity
          volumeMounts:
            - { name: sys, mountPath: /sys }
            - { name: hostvar, mountPath: /host/var/lib/model1_1 }
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: sys
          hostPath: { path: /sys, type: Directory }
        - name: hostvar
          hostPath: { path: /var/lib/model1_1, type: DirectoryOrCreate }
        - name: scripts
          configMap: { name: model1-1-node-prep-scripts, defaultMode: 0755 }
