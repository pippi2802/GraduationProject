# =============================================================================
# Model 1_1 RT-cell TEMPLATE. Renders one CELL from (scale, U) via
# manifests/template/render.py (pure-Python ${VAR} substitution), which reads
# config.yaml + the calibrated K table (nothing hardcoded here).
#
# The inner task is the COMPILED matmul probe (image.full_ref), pinned to the
# KubeDeadline-allocated core ($RT_CPUSET) and run for a FIXED N jobs -> the pod
# COMPLETES on its own (the orchestrator just waits for completion, no polling).
#
# >>> KUBEDEADLINE RESERVATION (rt-DRA / RtClaimParameters): runtime->Q, period->P,
#     count->m, microseconds. KubeDeadline pins the reserved container.
# =============================================================================
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata:
  namespace: ${NAMESPACE}
  name: ${CELL_ID}-params
spec:
  count: ${RES_COUNT}       # m (cores)
  runtime: ${RES_RUNTIME}   # Q
  period: ${RES_PERIOD}     # P
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata:
  namespace: ${NAMESPACE}
  name: ${CELL_ID}-claim
spec:
  spec:
    resourceClassName: ${RES_CLASS}
    parametersRef:
      apiGroup: rt.resource.example.com
      kind: RtClaimParameters
      name: ${CELL_ID}-params
---
apiVersion: v1
kind: Pod
metadata:
  namespace: ${NAMESPACE}
  name: ${CELL_ID}
  labels:
    app: model1-1-rt
    cell: "${CELL_ID}"
    scale: "${SCALE}"
spec:
  restartPolicy: Never
  nodeSelector:
    ${NODE_LABEL_KEY}: "${NODE_LABEL_VAL}"
  tolerations:
    - operator: Exists
  containers:
    - name: matmul
      image: ${IMAGE}
      imagePullPolicy: ${PULL_POLICY}
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          mkdir -p /results
          # start each cell clean (hostPath persists across pods)
          rm -f /results/jobs.csv 2>/dev/null || true
          # KubeDeadline (rt-DRA) pins this container to its allocated core and
          # exposes it via RT_CPUSET; taskset re-pins the matmul thread to it.
          echo "[matmul] cell=${CELL_ID} RT_CPUSET=$RT_CPUSET K=${K_REPS} M=${MATRIX_M} P=${PERIOD_US}us N=${N_JOBS}"
          if [ -n "$RT_CPUSET" ]; then
            exec taskset -c "$RT_CPUSET" /usr/local/bin/matmul \
              --M ${MATRIX_M} --K ${K_REPS} --period-us ${PERIOD_US} \
              --n-jobs ${N_JOBS} --warmup ${WARMUP} --priority ${PRIORITY} \
              --cpu env --seed ${SEED} --logfile /results/jobs.csv
          else
            exec /usr/local/bin/matmul \
              --M ${MATRIX_M} --K ${K_REPS} --period-us ${PERIOD_US} \
              --n-jobs ${N_JOBS} --warmup ${WARMUP} --priority ${PRIORITY} \
              --seed ${SEED} --logfile /results/jobs.csv
          fi
      securityContext:
        capabilities:
          add: ["SYS_NICE", "IPC_LOCK"]   # FIFO scheduling + lock_pages
      volumeMounts:
        - { name: results, mountPath: /results }
      resources:
        claims:
          - name: rtcpu
  resourceClaims:
    - name: rtcpu
      source:
        resourceClaimTemplateName: ${CELL_ID}-claim
  volumes:
    - name: results
      hostPath: { path: ${HOST_RESULTS_PATH}, type: DirectoryOrCreate }
