# BASE manifest for one model-4-m cell -- identical design to model4's own
# job.yaml (see there for the full rationale), just its own namespace/node so
# it can run concurrently with model4-p on a different physical node.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq1-model4-m, name: "@@NAME@@-params" }
# requestedCpus restored 2026-08-12: root cause found and fixed properly.
# A non-consecutive pair (1,3, needed for physical separation on this 4-cpu
# topology) exposed that job.yaml's own RT_CPUSET shell normalization
# wrongly treated the driver's hyphen-joined cpu list as an inclusive RANGE
# ("1-3" -> {1,2,3}) instead of a plain delimiter -- containerd's own
# ExtractCDI (pkg/cri/server/container_create.go, forked containerd) already
# treats it as a delimiter (`strings.Replace(cpuset, "-", ",", -1)`), so the
# driver-side cdi.go was never actually broken; two earlier driver-side
# "fixes" (v1.0.1/v1.0.2) chased the wrong layer and got reverted. Fixed at
# the actual source: job.yaml's normalization now also treats hyphens as
# delimiters, matching containerd's own convention.
spec: { count: 2, runtime: @@RUNTIME@@, period: @@PERIOD@@, requestedCpus: [1, 3] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq1-model4-m, name: "@@NAME@@-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "@@NAME@@-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model4-m
  name: "@@NAME@@"
  labels: { app: model4-m, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model4-m }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1-probe:v4
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          # CORRECTED 2026-08-12: the driver (dra-rt-driver's WriteCgroupToCDI,
          # via containerd's own ExtractCDI which mirrors the same convention)
          # ALWAYS hyphen-joins the claimed cpu list as a plain delimiter --
          # never a range, whether the ids are consecutive or not. The
          # original 2026-08-09 fix ("3-2" broke taskset/matmul) correctly
          # spotted the symptom but wrongly diagnosed it as a reversed RANGE;
          # it's not a range at all, so seq-expanding "1-3" into {1,2,3} was
          # itself a bug -- silently three cpus instead of the two actually
          # allocated. Every past pair happened to be consecutive, where
          # "reversed range" and "hyphen-delimited pair" normalize to the same
          # result by coincidence; requestedCpus letting callers pick genuinely
          # non-consecutive, physically-separated pairs (e.g. 1,3) exposed it.
          # Treat hyphens as plain delimiters, same as commas -- never a range.
          if [ -n "$RT_CPUSET" ]; then
            RT_CPUSET=$(echo "$RT_CPUSET" | tr '-' ',' | tr ',' '\n' | grep -v '^$' | sort -n | paste -sd, -)
            PIN="taskset -c $RT_CPUSET"; CPU="--threads 2 --cpu-list env"
          else
            PIN=""; CPU="--threads 2 --cpu-list 0,1"
          fi
          exec $PIN /usr/local/bin/matmul --M 48 --K @@K@@ --period-us @@PERIOD@@ \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 $CPU \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "@@NAME@@-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model4-m/@@SUB@@/target, type: DirectoryOrCreate }
