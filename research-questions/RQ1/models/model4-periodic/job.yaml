# BASE manifest for one model4-periodic cell -- solo reserved probe, release
# is the standard clock_nanosleep precomputed schedule (activation=periodic
# is matmul.c's default, no --activation flag needed). This is the control
# arm for the periodic-vs-event-triggered release-jitter comparison; see
# models/model4-event/job.yaml for the other arm. No co-runner, so (like
# model1) requestedCpus doesn't matter -- any non-KEEP_CPU cpu is fine.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata: { namespace: rq1-model4-periodic, name: "@@NAME@@-params" }
spec: { count: 1, runtime: @@RUNTIME@@, period: @@PERIOD@@, requestedCpus: [@@REQUESTED_CPUS@@] }
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata: { namespace: rq1-model4-periodic, name: "@@NAME@@-claim" }
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef: { apiGroup: rt.resource.example.com, kind: RtClaimParameters, name: "@@NAME@@-params" }
---
apiVersion: v1
kind: Pod
metadata:
  namespace: rq1-model4-periodic
  name: "@@NAME@@"
  labels: { app: model4-periodic, role: target }
spec:
  restartPolicy: Never
  nodeSelector: { experiment-model: model4-m }
  tolerations: [{ operator: Exists }]
  containers:
    - name: probe
      image: pippina2/rq1-probe:v7
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash","-c"]
      args:
        - |
          set -e; mkdir -p /results; rm -f /results/jobs.csv || true
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; CPU="--cpu env"; else PIN=""; CPU=""; fi
          exec $PIN /usr/local/bin/matmul --M 48 --K @@K@@ --period-us @@PERIOD@@ \
            --n-jobs 5000 --warmup 200 --priority 90 --seed 20260713 $CPU \
            --logfile /results/jobs.csv
      securityContext: { capabilities: { add: ["SYS_NICE","IPC_LOCK"] } }
      resources: { claims: [{ name: rtcpu }] }
      volumeMounts: [{ name: results, mountPath: /results }]
  resourceClaims:
    - { name: rtcpu, source: { resourceClaimTemplateName: "@@NAME@@-claim" } }
  volumes:
    - name: results
      hostPath: { path: /var/lib/rq1/model4-periodic/@@SUB@@/target, type: DirectoryOrCreate }
