# =============================================================================
# Model 1 — Clean-baseline real-time experiment for KubeDeadline on AKS  (RQ1)
# =============================================================================
# Single source of truth for ALL parameters. Every script/manifest generator
# reads THIS file; nothing below should be duplicated (DRY). Models 2/3/4
# extend this file (add neighbours / HT pinning / IRQ steering) without
# rewriting the harness.
#
# Two-level hierarchy recap:
#   outer = container = CBS server (Q, P, m)  -> bandwidth alpha = Q/P,
#                                                bounded service delay Delta = 2*(P - Q)
#   inner = ONE SCHED_FIFO task (period = P, run = Q) consuming the budget.
# Model 1 simplification: exactly one FIFO task per container, m = 1,
# task period = P, task run = Q, so U = Q/P coincides with task utilization.
# =============================================================================

model: 1
description: >-
  Clean baseline / reference. No co-located workload. Confirms the reservation
  holds under the "1 vCPU = 1 dedicated core" assumption and measures the
  irreducible hypervisor steal-time noise floor.

# -----------------------------------------------------------------------------
# NODE / HARDWARE
# -----------------------------------------------------------------------------
# Do NOT hardcode node names anywhere. The orchestrator resolves the actual
# node from the kubectl context / scheduled pod. These are descriptive facts
# used for sanity checks and metadata only.
node:
  instance_type: Standard_D4s_v5
  vcpus: 4                 # logical CPUs the guest sees
  physical_cores: 2        # true cores (hyper-threaded -> 2 siblings each)
  smt: true                # hyper-threading on; siblings must be offlined
  # KubeDeadline performs CPU pinning/affinity for the reserved container.
  # Do NOT enable the Kubernetes CPU Manager.
  use_k8s_cpu_manager: false

# -----------------------------------------------------------------------------
# CPU ASSIGNMENT (filled/validated at runtime by node-prep from real topology)
# -----------------------------------------------------------------------------
# node-prep detects sibling pairs from
#   /sys/devices/system/cpu/cpuN/topology/thread_siblings_list  (or `lscpu -e`)
# and picks ONE logical CPU per physical core for RT + canary, then takes the
# SIBLINGS OFFLINE. These are DEFAULT intentions; node-prep fails loudly and
# overrides if the real topology differs.
cpu_assignment:
  rt_core_logical: 0       # RT-container-under-test runs here (physical core A)
  canary_core_logical: 2   # continuous canary runs here (physical core B)
  offline_siblings: [1, 3] # hyper-thread siblings taken offline (idle)
  fail_if_topology_unknown: true

# -----------------------------------------------------------------------------
# TIMESCALES / SCALES
# -----------------------------------------------------------------------------
# Q is DERIVED, never hardcoded:  Q_us = round(U * P_us)
scales:
  tight:
    dir: tight-10ms          # manifests/results split directory name
    period_ms: 10
    period_us: 10000
    utilizations: [0.2, 0.4, 0.6, 0.8, 0.9, 0.95]
    # tight floor is 0.2: below it Q < 2 ms hits the VM measurement noise floor
  soft:
    dir: soft-100ms          # manifests/results split directory name
    period_ms: 100
    period_us: 100000
    utilizations: [0.1, 0.2, 0.4, 0.6, 0.8, 0.9, 0.95]

# m (cores) is fixed to 1 for Model 1 (mandatory simplification).
cores_per_container: 1

# -----------------------------------------------------------------------------
# PER-CELL STOPPING RULE (convergence-based, per-U floor/ceiling)
# -----------------------------------------------------------------------------
stopping_rule:
  warmup_jobs: 10             # SMOKE TEST: tiny warm-up (was 1000) so 100 rounds is quick

  convergence:
    metric: p99_9              # running p99.9 of response time R
    also_track: [running_max, evt_pot_tail_index]  # POT = peaks-over-threshold
    rel_change_threshold: 0.01 # "stable" = |rel change| < 1% ...
    window_fraction: 0.20      # ... over the most recent 20% of collected jobs
    min_window_jobs: 5000      # don't evaluate convergence on tiny windows

  # Floor / ceiling on collected job count N (AFTER warm-up).
  # SMOKE TEST: 100 rounds per U just to confirm the pipeline works.
  # Restore to 10000 (and warmup_jobs: 1000) for the real sweep.
  n_min: 100                  # applies to ALL cells
  n_max_default: 100          # every cell (no per-U override; see below)

  # No overrides: every U collects the same 10000 jobs (after warm-up).
  n_max_overrides: []

  # Keep collecting until p99.9 converges, but never below n_min, never above n_max.
  max_duration_seconds: 10800  # 3 h hard guard per cell; record if it fired.

# -----------------------------------------------------------------------------
# TIME-BLOCKING
# -----------------------------------------------------------------------------
# The whole sweep is re-runnable as a labelled time-block (--timeblock LABEL),
# repeated 3-5x across hours/days. Aggregate analysis combines jobs per cell
# across blocks (hypervisor steal is time-correlated -> temporal spread matters).
timeblock:
  recommended_repeats: [3, 5]
  label_format: "tb-{YYYYMMDD}-{HHMM}"   # informational; caller passes any label

# -----------------------------------------------------------------------------
# CANARY (continuous, never torn down between cells)
# -----------------------------------------------------------------------------
canary:
  enabled: true
  utilization: 0.1
  scale: soft                # fixed timescale for the canary (P = 100 ms)
  cores: 1
  # Logs the SAME metrics as the RT container to measure ambient contention.

# -----------------------------------------------------------------------------
# EXECUTION ORDERING
# -----------------------------------------------------------------------------
execution:
  sequential: true           # exactly one RT container-under-test alive at a time
  parallel_u_levels: false   # NEVER parallelize U (would create contention)
  recreate_between_cells: true  # delete + recreate (NOT in-place patch) per cell
  inter_cell_settle_seconds: 5  # brief idle so CBS fully de-admits before next cell

# -----------------------------------------------------------------------------
# WORKLOAD GENERATOR (rt-app)
# -----------------------------------------------------------------------------
# https://github.com/scheduler-tools/rt-app
# One thread, SCHED_FIFO, run = Q (us), period/timer = P (us), deadline = P,
# per-loop logging enabled so we can extract per-job R/C/slack/miss.
rtapp:
  policy: SCHED_FIFO
  priority: 90
  threads: 1
  per_job_logging: true
  lock_pages: true
  # rt-app has a FIXED per-job overhead (timer arm, clock_gettime, per-loop log
  # write) that also consumes the CBS budget. With "task run = Q" the reservation
  # is loaded to ~100%, so at tight scale (small Q) this overhead can exceed the
  # margin. Measure per node (see README) and subtract so the busy loop =
  # Q - overhead_us and the task footprint ~= Q. 0 = disabled (busy loop = Q).
  # Validated on tight-U0.2 (see docs/FINDING-rtapp-overhead-tight-scale.md):
  # 700 flips tight cells from divergent to bounded. Required for tight scale.
  overhead_us: 700
  min_run_us: 500          # never size the busy loop below this many us
  # run/period/deadline/timer are derived per cell from (P, Q); see rtapp/generator.

# -----------------------------------------------------------------------------
# MEASUREMENT / SAMPLING
# -----------------------------------------------------------------------------
# Sidecar/DaemonSet sampling on a COMMON CLOCK_MONOTONIC_RAW timeline.
sampling:
  clock: CLOCK_MONOTONIC_RAW
  # Sample fast enough for the timescale; tight scale needs the higher rate.
  rate_hz:
    tight: 1000
    soft: 100
  server_level:              # supply: RT container cgroup cpu.stat
    source: cgroup_cpu_stat
    field: usage_usec        # cumulative -> alpha_eff, empirical supply-bound, Delta_eff
  covariates:
    steal_time:
      - /proc/stat            # per-CPU steal column on the RT core
      - /proc/<pid>/schedstat # per-task run-delay (runnable-but-not-running)
    irq:
      - /proc/interrupts      # counts on the RT core
      - /proc/softirqs
      - /proc/stat            # irq/softirq columns
    freeze_detection:
      monotonic_timestamp: true
      # large gaps flag a VM freeze / live-migration -> EXCLUDE contaminated runs
      gap_flag_multiplier: 5  # gap > 5x expected sample interval => flag
  # CPU-ONLY: no memory/cache stressors anywhere (Model 1 has no neighbours).

# -----------------------------------------------------------------------------
# RESULTS LAYOUT
# -----------------------------------------------------------------------------
results:
  root: results
  # results/<timeblock>/<scale-dir>/U<U>/...  (scale-dir = tight-10ms | soft-100ms)
  path_template: "results/{timeblock}/{scale_dir}/U{u}"
  host_path: /var/lib/model1/results   # node-side hostPath mount for pods
  per_job_csv: jobs.csv
  server_csv: server.csv
  covariates_csv: covariates.csv
  cell_metadata_json: cell.json

# -----------------------------------------------------------------------------
# KUBEDEADLINE RESERVATION SPEC  <<< SINGLE PLACEHOLDER — CONFIRM BEFORE USE >>>
# -----------------------------------------------------------------------------
# The RT container is reserved by KubeDeadline with (Q, P, m=1). The EXACT
# schema MUST be confirmed by the user before manifests are finalized. This is
# the ONE place the schema lives; the generator reads only from here.
#
# DISCOVERED CANDIDATE (from workloads/rt-dra-verify): a DRA-based flow using
#   - CRD  RtClaimParameters (apiGroup rt.resource.example.com/v1alpha1)
#            spec.runtime  -> Q   (microseconds)
#            spec.period   -> P   (microseconds)
#            spec.count    -> m   (number of cores)
#   - ResourceClaimTemplate (resource.k8s.io/v1alpha2) -> resourceClassName rt.example.com
#   - Pod: spec.resourceClaims[] + container resources.claims[]
#
# NOTE: The ECRTS paper uses apiGroup rt.resource.kubedeadline.io and
# resourceClassName rt.kubedeadline.io. The in-repo verify workload uses the
# *.example.com names. CONFIRMED by user: use the in-repo *.example.com DRA
# flow (matches workloads/rt-dra-verify); runtime->Q, period->P, count->m.
kubedeadline_reservation_spec:
  confirmed: true            # user confirmed the DRA flow + *.example.com names
  mechanism: dra             # one of: dra | crd | annotations
  # UNITS: runtime/period emitted in MICROSECONDS (Q_us, P_us) by default. This
  # matches cgroup cpu.rt_runtime_us / cpu.rt_period_us and keeps fractional-ms
  # budgets integer (e.g. U=0.95 tight -> Q = 9500 us). Set units: milliseconds
  # if the CRD expects ms and the generator will divide by 1000.
  units: microseconds
  dra:
    claim_params_api_version: rt.resource.example.com/v1alpha1
    claim_params_kind: RtClaimParameters
    runtime_field: runtime   # <- Q
    period_field: period     # <- P
    count_field: count       # <- m
    resource_class_name: rt.example.com
    claim_template_api_version: resource.k8s.io/v1alpha2
  # If instead annotations/CRD-of-a-different-shape are used, replace the above.

# -----------------------------------------------------------------------------
# CONTAINER IMAGE  <<< CONFIRM BEFORE USE >>>
# -----------------------------------------------------------------------------
# Candidate (mirrors rt-dra-verify): NO custom image. Use an ubuntu base and
# install rt-app / python at container start from a ConfigMap-mounted entrypoint
# (nothing to build or push). rt-app is in the Ubuntu 'universe' repo as `rt-app`.
# CONFIRMED by user: ubuntu:24.04 base + install rt-app at runtime (no build).
image:
  confirmed: true            # user confirmed ubuntu:24.04 install-at-runtime
  strategy: install-at-runtime          # no image build; apt-install in entrypoint
  base_image: ubuntu:24.04
  pull_policy: IfNotPresent
  rtapp_apt_package: rt-app             # apt package that provides /usr/bin/rt-app
  sampler_apt_packages: [python3]       # sampler is stdlib-only python3

# -----------------------------------------------------------------------------
# SAMPLER DEPLOYMENT
# -----------------------------------------------------------------------------
sampler:
  mode: daemonset            # privileged node-wide DaemonSet
  host_pid: true             # needed for /proc/<pid>/schedstat of the RT thread
  privileged: true           # needed to read host /proc + container cgroups

# -----------------------------------------------------------------------------
# RT SYSCTL EXPECTATIONS (recorded per cell; not set by this harness)
# -----------------------------------------------------------------------------
rt_sysctls_recorded:
  - kernel.sched_rt_runtime_us
  - kernel.sched_rt_period_us
