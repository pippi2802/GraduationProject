# =============================================================================
# Model 1 RT-cell TEMPLATE. Renders one CELL from (scale, U) via
# manifests/template/render.py (pure-Python ${VAR} substitution; no envsubst),
# which reads config.yaml as the single source of truth (Q = round(U*P), units,
# images, host paths - nothing hardcoded here). One RT-container-under-test at a
# time (see EXECUTION ORDERING).
#
# >>> KUBEDEADLINE RESERVATION SPEC (CONFIRMED: DRA / RtClaimParameters) <<<
#     runtime -> Q, period -> P, count -> m. Units per config
#     (kubedeadline_reservation_spec.units, default microseconds). KubeDeadline
#     performs the CPU pinning/affinity for this reserved container.
# =============================================================================
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata:
  namespace: model1
  name: tight-u60-params
spec:
  count: 1       # m (cores). Paper: RtClaimParameters.count = number
                            # of cores; the driver's admission test picks WHICH CPU.
  runtime: 6000   # Q
  period: 10000     # P
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata:
  namespace: model1
  name: tight-u60-claim
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef:
      apiGroup: rt.resource.example.com
      kind: RtClaimParameters
      name: tight-u60-params
---
apiVersion: v1
kind: Pod
metadata:
  namespace: model1
  name: tight-u60
  labels:
    app: model1-rt
    cell: "tight-u60"
    scale: "tight"
spec:
  restartPolicy: Never
  nodeSelector:
    model1/rt-node: "true"
  tolerations:
    - operator: Exists
  containers:
    - name: rtapp
      image: ubuntu:24.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          command -v rt-app >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rt-app; }
          mkdir -p /results
          # KubeDeadline (rt-DRA) pins this container to its allocated core and
          # exposes it via the RT_CPUSET env var. Pin rt-app to it; if absent,
          # inherit the driver-set cpuset.
          if [ -n "$RT_CPUSET" ]; then
            echo "[rtapp] cell=tight-u60 RT_CPUSET=$RT_CPUSET"
            exec taskset -c "$RT_CPUSET" rt-app /config/rtapp.json
          else
            echo "[rtapp] cell=tight-u60 no RT_CPUSET; inheriting cpuset"
            exec rt-app /config/rtapp.json
          fi
      securityContext:
        capabilities:
          add: ["SYS_NICE", "IPC_LOCK"]   # FIFO scheduling + lock_pages
      volumeMounts:
        - { name: results,  mountPath: /results }
        - { name: rtapp-config, mountPath: /config }
      resources:
        claims:
          - name: rtcpu
  resourceClaims:
    - name: rtcpu
      source:
        resourceClaimTemplateName: tight-u60-claim
  volumes:
    - name: results
      hostPath: { path: /var/lib/model1/results/manual/tight-10ms/U0.6, type: DirectoryOrCreate }
    - name: rtapp-config
      configMap: { name: tight-u60-rtapp }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tight-u60-rtapp
  namespace: model1
data:
  rtapp.json: "{\n  \"tasks\": {\n    \"rt\": {\n      \"policy\": \"SCHED_FIFO\"\
    ,\n      \"priority\": 90,\n      \"loop\": -1,\n      \"run\": 6000,\n      \"\
    timer\": {\n        \"ref\": \"rt\",\n        \"period\": 10000,\n        \"mode\"\
    : \"absolute\"\n      }\n    }\n  },\n  \"global\": {\n    \"duration\": -1,\n\
    \    \"default_policy\": \"SCHED_FIFO\",\n    \"lock_pages\": true,\n    \"logdir\"\
    : \"/results\",\n    \"log_basename\": \"rt-app\",\n    \"gnuplot\": false,\n\
    \    \"pi_enabled\": false\n  }\n}"

