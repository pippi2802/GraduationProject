# =============================================================================
# Model 1 RT-cell TEMPLATE. Renders one CELL from (scale, U) via
# manifests/template/render.py (pure-Python ${VAR} substitution; no envsubst),
# which reads config.yaml as the single source of truth (Q = round(U*P), units,
# images, host paths - nothing hardcoded here). One RT-container-under-test at a
# time (see EXECUTION ORDERING).
#
# >>> KUBEDEADLINE RESERVATION SPEC (CONFIRMED: DRA / RtClaimParameters) <<<
#     runtime -> Q, period -> P, count -> m. Units per config
#     (kubedeadline_reservation_spec.units, default microseconds). KubeDeadline
#     performs the CPU pinning/affinity for this reserved container.
# =============================================================================
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata:
  namespace: ${NAMESPACE}
  name: ${CELL_ID}-params
spec:
  count: ${RES_COUNT}       # m (cores). Paper: RtClaimParameters.count = number
                            # of cores; the driver's admission test picks WHICH CPU.
  runtime: ${RES_RUNTIME}   # Q
  period: ${RES_PERIOD}     # P
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata:
  namespace: ${NAMESPACE}
  name: ${CELL_ID}-claim
spec:
  spec:
    resourceClassName: ${RES_CLASS}
    parametersRef:
      apiGroup: rt.resource.example.com
      kind: RtClaimParameters
      name: ${CELL_ID}-params
---
apiVersion: v1
kind: Pod
metadata:
  namespace: ${NAMESPACE}
  name: ${CELL_ID}
  labels:
    app: model1-rt
    cell: "${CELL_ID}"
    scale: "${SCALE}"
spec:
  restartPolicy: Never
  nodeSelector:
    model1/rt-node: "true"
  tolerations:
    - operator: Exists
  containers:
    - name: rtapp
      image: ${BASE_IMAGE}
      imagePullPolicy: ${PULL_POLICY}
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          command -v rt-app >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq ${RTAPP_PKG}; }
          mkdir -p /results
          # KubeDeadline (rt-DRA) pins this container to its allocated core and
          # exposes it via the RT_CPUSET env var. Pin rt-app to it; if absent,
          # inherit the driver-set cpuset.
          if [ -n "$RT_CPUSET" ]; then
            echo "[rtapp] cell=${CELL_ID} RT_CPUSET=$RT_CPUSET"
            exec taskset -c "$RT_CPUSET" rt-app /config/rtapp.json
          else
            echo "[rtapp] cell=${CELL_ID} no RT_CPUSET; inheriting cpuset"
            exec rt-app /config/rtapp.json
          fi
      securityContext:
        capabilities:
          add: ["SYS_NICE", "IPC_LOCK"]   # FIFO scheduling + lock_pages
      volumeMounts:
        - { name: results,  mountPath: /results }
        - { name: rtapp-config, mountPath: /config }
      resources:
        claims:
          - name: rtcpu
  resourceClaims:
    - name: rtcpu
      source:
        resourceClaimTemplateName: ${CELL_ID}-claim
  volumes:
    - name: results
      hostPath: { path: ${HOST_RESULTS_PATH}, type: DirectoryOrCreate }
    - name: rtapp-config
      configMap: { name: ${CELL_ID}-rtapp }
