# =============================================================================
# Model 1 CANARY TEMPLATE. A CONTINUOUS single-FIFO-task container at fixed
# U = 0.1 on its OWN dedicated physical core (canary_cpu). Never torn down
# between cells - measures ambient contention alongside every RT cell.
# Rendered by manifests/template/render.py --canary (${VAR} substitution;
# config.yaml is the single source of truth). Deployment so it self-heals.
# =============================================================================
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata:
  namespace: model1
  name: model1-canary-params
spec:
  count: 1       # m (cores) = 1; driver auto-selects the CPU
  runtime: 10000   # Q = 0.1 * P
  period: 100000     # P (soft scale)
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata:
  namespace: model1
  name: model1-canary-claim
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef:
      apiGroup: rt.resource.example.com
      kind: RtClaimParameters
      name: model1-canary-params
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: model1
  name: model1-canary
  labels: { app: model1-canary }
spec:
  replicas: 1
  selector:
    matchLabels: { app: model1-canary }
  template:
    metadata:
      labels: { app: model1-canary, cell: "model1-canary", scale: "soft" }
    spec:
      nodeSelector:
        model1/rt-node: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: rtapp
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              export DEBIAN_FRONTEND=noninteractive
              command -v rt-app >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rt-app; }
              mkdir -p /results
              # rt-DRA pins the canary to its own allocated core (RT_CPUSET).
              if [ -n "$RT_CPUSET" ]; then
                echo "[canary] RT_CPUSET=$RT_CPUSET"
                exec taskset -c "$RT_CPUSET" rt-app /config/rtapp.json
              else
                echo "[canary] no RT_CPUSET; inheriting cpuset"
                exec rt-app /config/rtapp.json
              fi
          securityContext:
            capabilities:
              add: ["SYS_NICE", "IPC_LOCK"]
          volumeMounts:
            - { name: results,  mountPath: /results }
            - { name: rtapp-config, mountPath: /config }
          resources:
            claims:
              - name: rtcpu
      resourceClaims:
        - name: rtcpu
          source:
            resourceClaimTemplateName: model1-canary-claim
      volumes:
        - name: results
          hostPath: { path: /var/lib/model1/results/manual/soft-100ms/U0.1, type: DirectoryOrCreate }
        - name: rtapp-config
          configMap: { name: model1-canary-rtapp }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model1-canary-rtapp
  namespace: model1
data:
  rtapp.json: "{\n  \"tasks\": {\n    \"rt\": {\n      \"policy\": \"SCHED_FIFO\"\
    ,\n      \"priority\": 90,\n      \"loop\": -1,\n      \"run\": 10000,\n     \
    \ \"timer\": {\n        \"ref\": \"rt\",\n        \"period\": 100000,\n      \
    \  \"mode\": \"absolute\"\n      }\n    }\n  },\n  \"global\": {\n    \"duration\"\
    : -1,\n    \"default_policy\": \"SCHED_FIFO\",\n    \"lock_pages\": true,\n  \
    \  \"logdir\": \"/results\",\n    \"log_basename\": \"rt-app\",\n    \"gnuplot\"\
    : false,\n    \"pi_enabled\": false\n  }\n}"

