# =============================================================================
# Model 3 — RT reservation cell TEMPLATE. ONE KubeDeadline reservation (Q,P,m=1)
# holding ONE SCHED_FIFO matmul task that runs a FIXED N jobs then Completes.
# Used for BOTH arms (physical, sibling): the reservation + K are IDENTICAL across
# arms so C(sibling)/C(physical) is a pure hyper-thread inflation factor. Rendered
# by manifests/template/render.py (pure-Python ${VAR} substitution) from
# config.yaml + the REUSED Model 1_1 K table (nothing hardcoded here).
#
# In the sibling arm the interferer is a SEPARATE, UNRESERVED pod pinned to this
# RT container's HT SIBLING logical CPU (see interferer/interferer.template.yaml);
# it is launched by run_model3.py AFTER this pod is Ready (so its actual RT_CPUSET
# is known) -> guaranteed HT co-location despite the SMT-blind driver.
#
# >>> KUBEDEADLINE RESERVATION (rt-DRA / RtClaimParameters): runtime->Q, period->P,
#     count->m=1, microseconds. KubeDeadline pins the reserved container.
# =============================================================================
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata:
  namespace: ${NAMESPACE}
  name: ${RT_NAME}-params
spec:
  count: ${RES_COUNT}       # m (cores) = 1
  runtime: ${RES_RUNTIME}   # Q = round(U*P)
  period: ${RES_PERIOD}     # P
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata:
  namespace: ${NAMESPACE}
  name: ${RT_NAME}-claim
spec:
  spec:
    resourceClassName: ${RES_CLASS}
    parametersRef:
      apiGroup: rt.resource.example.com
      kind: RtClaimParameters
      name: ${RT_NAME}-params
---
apiVersion: v1
kind: Pod
metadata:
  namespace: ${NAMESPACE}
  name: ${RT_NAME}
  labels:
    app: model3-rt
    arm: "${ARM}"
    cell: "${CELL_ID}"
    scale: "${SCALE}"
spec:
  restartPolicy: Never
  nodeSelector:
    ${NODE_LABEL_KEY}: "${NODE_LABEL_VAL}"
  tolerations:
    - operator: Exists
  containers:
    - name: matmul
      image: ${IMAGE}
      imagePullPolicy: ${PULL_POLICY}
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          mkdir -p /results
          # start each cell clean (hostPath persists across pods)
          rm -f /results/jobs.csv 2>/dev/null || true
          if [ -n "$RT_CPUSET" ]; then PIN="taskset -c $RT_CPUSET"; else PIN=""; fi
          echo "[rt/${ARM}] cell=${CELL_ID} RT_CPUSET=$RT_CPUSET M=${MATRIX_M} K=${K_REPS} P=${PERIOD_US}us N=${N_JOBS}"
          exec $PIN /usr/local/bin/matmul \
            --M ${MATRIX_M} --K ${K_REPS} --period-us ${PERIOD_US} \
            --n-jobs ${N_JOBS} --warmup ${WARMUP} --priority ${PRIORITY} \
            --cpu env --seed ${SEED} --logfile /results/jobs.csv
      securityContext:
        capabilities:
          add: ["SYS_NICE", "IPC_LOCK"]   # FIFO scheduling + lock_pages
      volumeMounts:
        - { name: results, mountPath: /results }
      resources:
        claims:
          - name: rtcpu
  resourceClaims:
    - name: rtcpu
      source:
        resourceClaimTemplateName: ${RT_NAME}-claim
  volumes:
    - name: results
      hostPath: { path: ${HOST_RESULTS_PATH}, type: DirectoryOrCreate }
