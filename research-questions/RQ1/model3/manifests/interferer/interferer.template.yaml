# =============================================================================
# Model 3 — SIBLING-arm INTERFERER pod TEMPLATE (UNRESERVED). Runs the SAME fixed
# matmul on the RT container's HT SIBLING logical CPU as a SCHED_OTHER (CFS,
# priority 0) task, so it is NOT subject to RT-bandwidth throttling and competes
# with the RT task PURELY for the shared physical core's execution units (ALU / FPU
# / L1 / L2) -> the hyper-thread interference Model 3 measures. NO reservation, NO
# DRA claim: it only competes at the HARDWARE-THREAD level, not the CBS level.
#
# ${SIBLING_CPU} is filled at APPLY time by run_model3.py, AFTER the RT pod is Ready
# and its actual RT_CPUSET (hence its HT sibling) is known -> guaranteed HT
# co-location despite the SMT-blind driver. Intensity (${PERIOD_US}/${K_REPS}) is
# the swept `--sibling-load` knob: saturating => period 0 (continuous back-to-back);
# light/medium => a fixed period filled to `duty`. Runs continuously (huge N) and
# is deleted with the cell. Its own log (interferer.csv) is kept for provenance
# (confirms the interferer was actually saturating its sibling).
# =============================================================================
---
apiVersion: v1
kind: Pod
metadata:
  namespace: ${NAMESPACE}
  name: ${OBJ_NAME}
  labels:
    app: model3-interferer
    arm: "${ARM}"
    cell: "${CELL_ID}"
    scale: "${SCALE}"
    sibling-load: "${SIBLING_LOAD}"
spec:
  restartPolicy: Never
  nodeSelector:
    ${NODE_LABEL_KEY}: "${NODE_LABEL_VAL}"
  tolerations:
    - operator: Exists
  containers:
    - name: interferer
      image: ${IMAGE}
      imagePullPolicy: ${PULL_POLICY}
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          mkdir -p /results
          rm -f /results/interferer.csv 2>/dev/null || true
          echo "[interferer/${ARM}] cell=${CELL_ID} sibling_cpu=${SIBLING_CPU} load=${SIBLING_LOAD} M=${MATRIX_M} K=${K_REPS} period_us=${PERIOD_US}"
          # CFS (priority 0), pinned to the RT core's HT sibling logical CPU.
          exec taskset -c ${SIBLING_CPU} /usr/local/bin/matmul \
            --M ${MATRIX_M} --K ${K_REPS} --period-us ${PERIOD_US} \
            --n-jobs ${N_JOBS} --warmup 0 --priority 0 \
            --cpu ${SIBLING_CPU} --seed ${SEED} --logfile /results/interferer.csv
      securityContext:
        capabilities:
          add: ["SYS_NICE"]    # allow taskset affinity (no FIFO used)
      volumeMounts:
        - { name: results, mountPath: /results }
  volumes:
    - name: results
      hostPath: { path: ${HOST_RESULTS_PATH}, type: DirectoryOrCreate }
