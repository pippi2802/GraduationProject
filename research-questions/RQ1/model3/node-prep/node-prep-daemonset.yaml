# =============================================================================
# Model 3 node-prep DaemonSet (privileged; no custom image). Mounts the scripts
# from a ConfigMap (built by apply.sh), runs detect-siblings.sh (DETECT-ONLY:
# offlines NOTHING; writes cpu-map.json with the per-core sibling table), then
# idles. Re-runs on reboot. Targets the experiment-model=model3 node.
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: model3
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: model3-node-prep
  namespace: model3
  labels: { app: model3-node-prep }
spec:
  selector:
    matchLabels: { app: model3-node-prep }
  template:
    metadata:
      labels: { app: model3-node-prep }
    spec:
      hostPID: true
      nodeSelector:
        experiment-model: "model3"
      tolerations:
        - operator: Exists
      containers:
        - name: node-prep
          image: ubuntu:24.04
          securityContext:
            privileged: true
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              cp /scripts/detect-siblings.sh /scripts/offline-sibling.sh /scripts/online-siblings.sh /tmp/
              chmod +x /tmp/detect-siblings.sh /tmp/offline-sibling.sh /tmp/online-siblings.sh
              # DETECT-ONLY: offlining vCPUs wedges the Azure VM. Writes cpu-map.json
              # (per-core sibling table) and changes NO CPU online state.
              MAP_OUT=/host/var/lib/model3/cpu-map.json /tmp/detect-siblings.sh
              echo "[node-prep] detect-only done; idling (no CPUs offlined)."
              sleep infinity
          volumeMounts:
            - { name: sys, mountPath: /sys }
            - { name: hostvar, mountPath: /host/var/lib/model3 }
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: sys
          hostPath: { path: /sys, type: Directory }
        - name: hostvar
          hostPath: { path: /var/lib/model3, type: DirectoryOrCreate }
        - name: scripts
          configMap: { name: model3-node-prep-scripts, defaultMode: 0755 }
