# RENDERED EXAMPLE — generated by:  ./render.sh tight 0.95 tb-example
# Cell: tight scale (P=10ms), U=0.95  ->  Q=9500us, P=10000us, m=1.
# (Do not edit by hand; regenerate with render.sh. Shown for reference.)
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata:
  namespace: model1
  name: tight-u95-params
spec:
  count: 1
  runtime: 9500       # Q (microseconds)
  period: 10000       # P (microseconds)
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata:
  namespace: model1
  name: tight-u95-claim
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef:
      apiGroup: rt.resource.example.com
      kind: RtClaimParameters
      name: tight-u95-params
---
apiVersion: v1
kind: Pod
metadata:
  namespace: model1
  name: tight-u95
  labels:
    app: model1-rt
    cell: "tight-u95"
    scale: "tight"
spec:
  restartPolicy: Never
  nodeSelector:
    model1/rt-node: "true"
  tolerations:
    - operator: Exists
  containers:
    - name: rtapp
      image: ubuntu:24.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          command -v rt-app >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rt-app; }
          mkdir -p /results
          if [ -n "$RT_CPUSET" ]; then
            echo "[rtapp] cell=tight-u95 RT_CPUSET=$RT_CPUSET"
            exec taskset -c "$RT_CPUSET" rt-app /config/rtapp.json
          else
            echo "[rtapp] cell=tight-u95 no RT_CPUSET; inheriting cpuset"
            exec rt-app /config/rtapp.json
          fi
      securityContext:
        capabilities:
          add: ["SYS_NICE", "IPC_LOCK"]
      volumeMounts:
        - { name: results,  mountPath: /results }
        - { name: rtapp-config, mountPath: /config }
      resources:
        claims:
          - name: rtcpu
  resourceClaims:
    - name: rtcpu
      source:
        resourceClaimTemplateName: tight-u95-claim
  volumes:
    - name: results
      hostPath: { path: /var/lib/model1/results/tb-example/tens-of-ms/U0.95, type: DirectoryOrCreate }
    - name: rtapp-config
      configMap: { name: tight-u95-rtapp }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tight-u95-rtapp
  namespace: model1
data:
  rtapp.json: |
    {
      "tasks": {
        "rt": {
          "policy": "SCHED_FIFO",
          "priority": 90,
          "loop": -1,
          "run": 9500,
          "timer": { "ref": "rt", "period": 10000, "mode": "absolute" }
        }
      },
      "global": {
        "duration": -1,
        "default_policy": "SCHED_FIFO",
        "lock_pages": true,
        "logdir": "/results",
        "log_basename": "rt-app",
        "gnuplot": false,
        "pi_enabled": false
      }
    }
