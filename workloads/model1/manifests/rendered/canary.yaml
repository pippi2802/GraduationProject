# RENDERED EXAMPLE — generated by:  ./render.sh --canary tb-example
# Continuous canary: soft scale (P=100ms), U=0.1 -> Q=10000us, P=100000us, m=1,
# pinned to its OWN physical core (canary_cpu). NEVER torn down between cells.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata:
  namespace: model1
  name: model1-canary-params
spec:
  count: 1
  runtime: 10000      # Q (microseconds)
  period: 100000      # P (microseconds)
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata:
  namespace: model1
  name: model1-canary-claim
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef:
      apiGroup: rt.resource.example.com
      kind: RtClaimParameters
      name: model1-canary-params
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: model1
  name: model1-canary
  labels: { app: model1-canary }
spec:
  replicas: 1
  selector:
    matchLabels: { app: model1-canary }
  template:
    metadata:
      labels: { app: model1-canary, cell: "model1-canary", scale: "soft" }
    spec:
      nodeSelector:
        model1/rt-node: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: rtapp
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              export DEBIAN_FRONTEND=noninteractive
              command -v rt-app >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rt-app; }
              CPU=$(grep -o '"canary_cpu": *[0-9]\+' /host-map/cpu-map.json | grep -o '[0-9]\+' | head -n1)
              CPU=${CPU:-2}
              cp /config/rtapp.json /tmp/rtapp.json
              sed -i "s/\"cpus\": *\[[0-9]*\]/\"cpus\": [$CPU]/" /tmp/rtapp.json
              sed -i "s/\"calibration\": *\"CPU[0-9]*\"/\"calibration\": \"CPU$CPU\"/" /tmp/rtapp.json
              mkdir -p /results
              echo "[canary] pinned cpu=$CPU"
              exec rt-app /tmp/rtapp.json
          securityContext:
            capabilities:
              add: ["SYS_NICE", "IPC_LOCK"]
          volumeMounts:
            - { name: results,  mountPath: /results }
            - { name: rtapp-config, mountPath: /config }
            - { name: cpu-map,  mountPath: /host-map, readOnly: true }
          resources:
            claims:
              - name: rtcpu
      resourceClaims:
        - name: rtcpu
          source:
            resourceClaimTemplateName: model1-canary-claim
      volumes:
        - name: results
          hostPath: { path: /var/lib/model1/results/tb-example/hundreds-of-ms/U0.1, type: DirectoryOrCreate }
        - name: rtapp-config
          configMap: { name: model1-canary-rtapp }
        - name: cpu-map
          hostPath: { path: /var/lib/model1, type: DirectoryOrCreate }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model1-canary-rtapp
  namespace: model1
data:
  rtapp.json: |
    {
      "tasks": {
        "rt": {
          "policy": "SCHED_FIFO",
          "priority": 90,
          "cpus": [2],
          "lock_pages": true,
          "loop": -1,
          "run": 10000,
          "timer": { "ref": "rt", "period": 100000, "mode": "absolute" }
        }
      },
      "global": {
        "duration": -1,
        "default_policy": "SCHED_FIFO",
        "lock_pages": true,
        "calibration": "CPU2",
        "logdir": "/results",
        "log_basename": "rt-app",
        "gnuplot": false,
        "pi_enabled": false
      }
    }
