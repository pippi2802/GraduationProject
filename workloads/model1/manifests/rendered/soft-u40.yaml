# RENDERED EXAMPLE — generated by:  ./render.sh soft 0.4 tb-example
# Cell: soft scale (P=100ms), U=0.4  ->  Q=40000us, P=100000us, m=1.
---
apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata:
  namespace: model1
  name: soft-u40-params
spec:
  count: 1
  runtime: 40000      # Q (microseconds)
  period: 100000      # P (microseconds)
---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata:
  namespace: model1
  name: soft-u40-claim
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef:
      apiGroup: rt.resource.example.com
      kind: RtClaimParameters
      name: soft-u40-params
---
apiVersion: v1
kind: Pod
metadata:
  namespace: model1
  name: soft-u40
  labels:
    app: model1-rt
    cell: "soft-u40"
    scale: "soft"
spec:
  restartPolicy: Never
  nodeSelector:
    model1/rt-node: "true"
  tolerations:
    - operator: Exists
  containers:
    - name: rtapp
      image: ubuntu:24.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          command -v rt-app >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq rt-app; }
          CPU=$(grep -o '"rt_cpu": *[0-9]\+' /host-map/cpu-map.json | grep -o '[0-9]\+' | head -n1)
          CPU=${CPU:-0}
          cp /config/rtapp.json /tmp/rtapp.json
          sed -i "s/\"cpus\": *\[[0-9]*\]/\"cpus\": [$CPU]/" /tmp/rtapp.json
          sed -i "s/\"calibration\": *\"CPU[0-9]*\"/\"calibration\": \"CPU$CPU\"/" /tmp/rtapp.json
          mkdir -p /results
          echo "[rtapp] cell=soft-u40 pinned cpu=$CPU"
          exec rt-app /tmp/rtapp.json
      securityContext:
        capabilities:
          add: ["SYS_NICE", "IPC_LOCK"]
      volumeMounts:
        - { name: results,  mountPath: /results }
        - { name: rtapp-config, mountPath: /config }
        - { name: cpu-map,  mountPath: /host-map, readOnly: true }
      resources:
        claims:
          - name: rtcpu
  resourceClaims:
    - name: rtcpu
      source:
        resourceClaimTemplateName: soft-u40-claim
  volumes:
    - name: results
      hostPath: { path: /var/lib/model1/results/tb-example/hundreds-of-ms/U0.4, type: DirectoryOrCreate }
    - name: rtapp-config
      configMap: { name: soft-u40-rtapp }
    - name: cpu-map
      hostPath: { path: /var/lib/model1, type: DirectoryOrCreate }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soft-u40-rtapp
  namespace: model1
data:
  rtapp.json: |
    {
      "tasks": {
        "rt": {
          "policy": "SCHED_FIFO",
          "priority": 90,
          "cpus": [0],
          "lock_pages": true,
          "loop": -1,
          "run": 40000,
          "timer": { "ref": "rt", "period": 100000, "mode": "absolute" }
        }
      },
      "global": {
        "duration": -1,
        "default_policy": "SCHED_FIFO",
        "lock_pages": true,
        "calibration": "CPU0",
        "logdir": "/results",
        "log_basename": "rt-app",
        "gnuplot": false,
        "pi_enabled": false
      }
    }
