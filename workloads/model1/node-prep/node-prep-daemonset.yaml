# =============================================================================
# Model 1 node-prep DaemonSet (privileged; NO custom image).
# Mounts prepare-node.sh / restore-node.sh from a ConfigMap (built by apply.sh),
# runs prepare-node.sh once at startup to offline hyper-thread siblings, then
# idles. Re-runs on node reboot. Targets nodes labelled model1/rt-node=true.
#
# Apply with:  ./apply.sh     (builds the ConfigMap from the scripts first)
# Label a node: kubectl label node <NODE> model1/rt-node=true
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: model1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: model1-node-prep
  namespace: model1
  labels: { app: model1-node-prep }
spec:
  selector:
    matchLabels: { app: model1-node-prep }
  template:
    metadata:
      labels: { app: model1-node-prep }
    spec:
      hostPID: true
      nodeSelector:
        model1/rt-node: "true"      # label the target RT node(s) with this
      tolerations:
        - operator: Exists          # run even on tainted RT nodes
      containers:
        - name: node-prep
          image: ubuntu:24.04       # no custom image; script is mounted
          securityContext:
            privileged: true        # required to write /sys .../cpuN/online
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              cp /scripts/prepare-node.sh /scripts/restore-node.sh /tmp/
              chmod +x /tmp/prepare-node.sh /tmp/restore-node.sh
              MAP_OUT=/host/var/lib/model1/cpu-map.json /tmp/prepare-node.sh
              echo "[node-prep] done; idling. Delete this DS + run restore to undo."
              sleep infinity
          volumeMounts:
            - { name: sys,     mountPath: /sys }
            - { name: hostvar, mountPath: /host/var/lib/model1 }
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: sys
          hostPath: { path: /sys, type: Directory }
        - name: hostvar
          hostPath: { path: /var/lib/model1, type: DirectoryOrCreate }
        - name: scripts
          configMap: { name: model1-node-prep-scripts, defaultMode: 0755 }
