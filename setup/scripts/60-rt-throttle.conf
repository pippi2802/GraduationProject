# RT global bandwidth defaults for the H-CBS / RT_GROUP_SCHED worker kernel.
#
# WHY: this kernel boots with kernel.sched_rt_runtime_us at an UNSAFE value
# (-1 = RT throttling disabled on some boots, or == period = no slack on others).
# Either way a SCHED_FIFO/RR task can monopolise a CPU (starving kubelet/exec/kill)
# and the per-cgroup RT budget chain cannot be enforced. Pin a safe default EARLY
# (systemd-sysctl runs before display/graphics kthreads spawn, so this applies
# cleanly without the EBUSY that hits later writes).
#
# runtime STRICTLY < period so there is slack for non-RT work. The
# rt-budget-reseed.service additionally seeds the root->kubepods->besteffort
# cpu.rt_runtime_us chain once kubelet has created the slices.
kernel.sched_rt_period_us = 1000000
kernel.sched_rt_runtime_us = 990000
