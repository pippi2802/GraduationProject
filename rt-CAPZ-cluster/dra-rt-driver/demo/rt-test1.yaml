# Two pods, one container each
# Each container asking for 1 distinct GPU

---
apiVersion: v1
kind: Namespace
metadata:
  name: rt-test1

---
apiVersion: resource.k8s.io/v1alpha2
kind: ResourceClaimTemplate
metadata:
  namespace: rt-test1
  name: rt.example.com
spec:
  spec:
    resourceClassName: rt.example.com
    parametersRef:
      apiGroup: rt.resource.example.com
      kind: RtClaimParameters
      name: rtclaims

---

apiVersion: rt.resource.example.com/v1alpha1
kind: RtClaimParameters
metadata:
  namespace: rt-test1
  name: rtclaims
spec:
  count: 2
  runtime: 100
  period: 1000

---
apiVersion: v1
kind: Pod
metadata:
  namespace: rt-test1
  name: pod0
  labels:
    app: pod
spec:
  containers:
  - name: ctr0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args:
    - |
      echo "=== RT-DRA demo: pod0/ctr0 scheduler report ==="
      echo "injected env:"; export | grep -E 'RT_|CPUSET|RUNTIME|PERIOD' || true
      apt-get update -qq && apt-get install -y -qq util-linux >/dev/null 2>&1 || true
      echo "scheduler (chrt):"; chrt -p $$ || true
      echo "affinity (taskset):"; taskset -cp $$ || true
      echo "cgroup:"; cat /proc/self/cgroup || true
      echo "=== sleeping ==="; sleep 9999
    resources:
      claims:
      - name: rtcpu
  resourceClaims:
  - name: rtcpu
    source:
      resourceClaimTemplateName: rt.example.com

---
apiVersion: v1
kind: Pod
metadata:
  namespace: rt-test1
  name: pod1
  labels:
    app: pod
spec:
  containers:
  - name: ctr0
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args:
    - |
      echo "=== RT-DRA demo: pod1/ctr0 scheduler report ==="
      echo "injected env:"; export | grep -E 'RT_|CPUSET|RUNTIME|PERIOD' || true
      apt-get update -qq && apt-get install -y -qq util-linux >/dev/null 2>&1 || true
      echo "scheduler (chrt):"; chrt -p $$ || true
      echo "affinity (taskset):"; taskset -cp $$ || true
      echo "cgroup:"; cat /proc/self/cgroup || true
      echo "=== sleeping ==="; sleep 9999
    resources:
      claims:
      - name: rtcpu
  resourceClaims:
  - name: rtcpu
    source:
      resourceClaimTemplateName: rt.example.com